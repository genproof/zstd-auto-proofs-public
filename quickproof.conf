# quickproof config for zstd (quickproof/tools/clight.sh): the decoder.  qp adds one unit per harness/*.c.
# A safe configuration of lib/common + lib/decompress, set only by flags:
#   ZSTD_DISABLE_ASM, DYNAMIC_BMI2=0     no x86 assembly, no BMI2 dispatch
#   ZSTD_NO_INTRINSICS                   software bit counting (no __builtin_ctz/clz)
#   MEM_FORCE_MEMORY_ACCESS=0            memcpy-based unaligned reads/writes
#   XXH_FORCE_MEMORY_ACCESS=0, XXH_FORCE_ALIGN_CHECK=0
#                                        the same for xxhash, and no pointer-alignment test
#   ZSTD_LEGACY_SUPPORT=0                no pre-v0.8 formats
#   HUF_DISABLE_FAST_DECODE              the plain Huffman loops (the fast loops hold the only `goto`s)
# and the switches of the patch (patch/GENPROOF-PATCH.md):
#   GP_INPLACE(..)=0                     no in-place test: src and dst are separate objects
#   GP_DST_NEAR_TOP(..)=0                no address-range test on (size_t)dst
#   GP_NO_STRUCT_API                     without the public functions that pass a struct by value
#                                        (ZSTD_create{DCtx,DStream,DDict}_advanced, ZSTD_dParam_getBounds)
INC=(-Ilib -Ilib/common -isystem "$(gcc -print-file-name=include)")
DEFS=(-DZSTD_DISABLE_ASM -DDYNAMIC_BMI2=0 -DZSTD_NO_INTRINSICS -DMEM_FORCE_MEMORY_ACCESS=0
      -DXXH_FORCE_MEMORY_ACCESS=0 -DXXH_FORCE_ALIGN_CHECK=0 -DZSTD_LEGACY_SUPPORT=0 -DHUF_DISABLE_FAST_DECODE
      '-DGP_INPLACE(ip,op,oend)=0' '-DGP_DST_NEAR_TOP(dst)=0' -DGP_NO_STRUCT_API)
UNITS=(
  "patch/decoder.c=src/zstd"            # lib/common + lib/decompress in one unit (see patch/decoder.c)
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"   # the unit that owns malloc/free (VST's mem_mgr)
)

# one unit per harness/*.c (added by tools/qp)
UNITS+=(
  "harness/api_content_size.c=src/harness/api_content_size"
  "harness/api_dict_id.c=src/harness/api_dict_id"
